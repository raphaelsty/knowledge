services:
  postgres:
    image: postgres:16-alpine
    # Match prod (`docker-compose.dokploy.yml`) — the default 64 MB
    # /dev/shm is too small for VACUUM with parallel workers, which
    # the feed_snapshot daemon runs after every refresh.
    shm_size: 1g
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - "5433:5432"
    volumes:
      # Bind mount so the PG data directory lives on the host
      # (./.pgdata) rather than in a Docker-managed volume. Survives
      # `docker compose down -v` and `docker rm -v`; can be backed up
      # with a plain `cp -r .pgdata ~/backup`. Trade-off: bind-mount
      # I/O on macOS Docker Desktop is ~30% slower than a named
      # volume, but durability outweighs the speed hit here.
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 5

  knowledge-api:
    build:
      # See docker-compose.dokploy.yml — context is the repo root so
      # `include_str!("../../sources/sql/…")` can resolve at compile
      # time and the binary ships with all schema migrations baked in.
      context: .
      dockerfile: api/Dockerfile
    user: root
    ports:
      - "8080:8080"
    volumes:
      - ./indexes:/data/indices
      - models:/models
      - ./run.py:/app/run.py:ro
      - ./sources:/app/sources:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./sources.yml:/app/sources.yml:ro
      - ./README.md:/app/README.md:ro
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://knowledge:knowledge@postgres:5432/knowledge
      - API_URL=http://localhost:8080
      - RUST_LOG=info
      # ADMIN_API_KEY: read from .env in repo root; the binary checks
      # process env (not the mounted /app/.env file) so it must be
      # injected here. ${VAR} interpolates from the host's .env via
      # docker-compose's automatic .env loader.
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - KNOWLEDGE_ADMIN_TOKEN=${KNOWLEDGE_ADMIN_TOKEN}
      - OPENBLAS_NUM_THREADS=1
      # GitHub OAuth — uses the *_DEV pair from .env so the dev OAuth
      # app (with localhost callback) is picked up. Compose interpolates
      # ${VAR} from the .env file in this directory.
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID_DEV}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET_DEV}
      - OAUTH_REDIRECT_URL=http://localhost:8080/auth/github/callback
      - OAUTH_POST_LOGIN_URL=/
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --index-dir
      - /data/indices
      - --model
      - lightonai/answerai-colbert-small-v1-onnx
      - --int8
      - --parallel
      - "16"
      - --batch-size
      - "4"
      - --model-pool-size
      - "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G

  web:
    image: python:3.12-slim
    working_dir: /web
    command: python serve.py 3000
    ports:
      - "3001:3000"
    volumes:
      - ./web:/web:ro

volumes:
  # `pgdata` is no longer a Docker-managed volume — see the postgres
  # service's bind mount to ./.pgdata above. `models` is still a
  # named volume because it's cache data, not user data.
  models:
